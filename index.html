<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>서건교 근무달력</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap">
<style>
/* 레이아웃: 상단 오늘 카드 → 월 달력 → 선택일 상세 → 근무코드표. 휴대폰 한 손 조작 기준 */
:root{
  --bg:#f4f6f5; --card:#ffffff; --ink:#18231f; --mute:#6a7772; --line:#dfe5e2;
  --day:#1f8a70; --day-bg:#dff3ec; --mid:#b9791a; --mid-bg:#fbeacc;
  --night:#4a56b8; --night-bg:#e3e6fa; --off:#7b8581; --off-bg:#eceeed;
  --leave:#c2456a; --leave-bg:#fae0e8; --accent:#1f8a70;
  --font:'Noto Sans KR','Pretendard','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#11181a; --card:#1a2326; --ink:#e8f0ed; --mute:#93a39d; --line:#2b3838;
  --day:#58d0b0; --day-bg:#17352e; --mid:#e6b45a; --mid-bg:#3a2e14;
  --night:#9aa5f5; --night-bg:#23284d; --off:#98a39e; --off-bg:#222c2e;
  --leave:#f08aa9; --leave-bg:#40202c; --accent:#58d0b0;color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#11181a; --card:#1a2326; --ink:#e8f0ed; --mute:#93a39d; --line:#2b3838;
  --day:#58d0b0; --day-bg:#17352e; --mid:#e6b45a; --mid-bg:#3a2e14;
  --night:#9aa5f5; --night-bg:#23284d; --off:#98a39e; --off-bg:#222c2e;
  --leave:#f08aa9; --leave-bg:#40202c; --accent:#58d0b0;color-scheme:dark;}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.45;-webkit-text-size-adjust:100%}
main{max-width:480px;margin:0 auto;padding:16px 16px 40px;display:flex;flex-direction:column;gap:14px}
h1{font-size:18px;margin:0;font-weight:800}
.top{display:flex;align-items:center;gap:10px}
.top h1{flex:1}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
#todayTxt{flex:1;font-size:15px;font-weight:700;color:var(--mute)}
.menu-btn{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--card);display:flex;flex-direction:column;justify-content:center;align-items:center;gap:4px;padding:0}
.menu-btn span{display:block;width:18px;height:2px;border-radius:2px;background:var(--ink)}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:10}
.drawer{position:fixed;top:0;left:0;bottom:0;width:min(300px,84vw);background:var(--card);border-right:1px solid var(--line);z-index:11;padding:16px;overflow-y:auto}
.scrim[hidden],.drawer[hidden]{display:none}
.drawer-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;font-size:16px}
.drawer-head button{width:36px;height:36px;border-radius:9px;border:1px solid var(--line);background:transparent}

.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.today{display:block;padding:20px 18px;border-color:transparent}
.badge{min-width:58px;height:58px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:22px}
.today .lbl{font-size:14px;color:var(--ink);opacity:.72}
.today .big{font-size:32px;line-height:1.2;font-weight:800;font-variant-numeric:tabular-nums;margin-bottom:6px}
.today .sub{font-size:14px;color:var(--ink);opacity:.72}
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.cal-head b{font-size:17px}
.cal-head small{font-size:13px;font-weight:500;color:var(--mute);margin-left:4px}
.nav{display:flex;gap:6px}
button{font:inherit;color:inherit;cursor:pointer}
.nav button{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-size:18px}
.nav button.t{width:auto;padding:0 12px;font-size:13px}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.sum{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;font-size:12.5px;color:var(--mute)}
.sum i{font-style:normal;font-weight:700;color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.dow{text-align:center;font-size:12px;color:var(--mute);padding:2px 0}
.dow.su,.num.su{color:var(--leave)} .dow.sa,.num.sa{color:var(--night)}
.cell{min-height:54px;border-radius:9px;border:1px solid transparent;background:transparent;padding:3px 2px;display:flex;flex-direction:column;align-items:center;gap:2px}
.cell.empty{visibility:hidden}
.cell:not(.has){min-height:40px}
.cell .num{font-size:12px;font-variant-numeric:tabular-nums}
.chip{font-weight:800;font-size:14px;border-radius:7px;padding:1px 0;width:100%;text-align:center}
.cell .tm{font-size:9.5px;color:var(--mute);letter-spacing:-.3px;font-variant-numeric:tabular-nums}

.cell.tod{border-color:var(--accent);box-shadow:0 0 0 1.5px var(--accent)}
.cell.sel{background:var(--off-bg)}
.g-day{background:var(--day-bg);color:var(--day)} .g-mid{background:var(--mid-bg);color:var(--mid)}
.g-night{background:var(--night-bg);color:var(--night)} .g-off{background:var(--off-bg);color:var(--off)}
.g-leave{background:var(--leave-bg);color:var(--leave)}
.detail h2{font-size:16px;margin:0 0 4px}
.dline{font-size:15px;font-variant-numeric:tabular-nums}
.detail .row{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.detail .row .badge{min-width:48px;height:48px;font-size:19px}
.detail .tm{font-size:15px;font-variant-numeric:tabular-nums}
.detail .note{font-size:12.5px;color:var(--mute)}
.picks{display:flex;flex-wrap:wrap;gap:6px}
.picks button{height:36px;min-width:42px;padding:0 9px;border-radius:9px;border:1px solid var(--line);background:var(--card);font-weight:700;font-size:13.5px}
.picks button.on{border-color:var(--accent);box-shadow:0 0 0 1.5px var(--accent)}
.hint{font-size:12px;color:var(--mute);margin:8px 0 0}
.reset{margin-top:6px;border:0;background:transparent;color:var(--mute);border-radius:9px;height:34px;padding:0;font-size:13px;text-decoration:underline}
.legend{display:grid;grid-template-columns:auto 1fr;gap:5px 10px;font-size:13px;font-variant-numeric:tabular-nums}
.legend .c{font-weight:800;text-align:center;border-radius:6px;padding:0 8px;min-width:34px}
.legend h3{grid-column:1/-1;margin:8px 0 0;font-size:12px;color:var(--mute);font-weight:700}
.legend h3:first-child{margin-top:0}
.photo{padding:14px}
.photo h2{font-size:15px;margin:0 0 10px;font-weight:800}
.pbtn.primary{background:var(--accent);border-color:var(--accent);color:var(--bg)}
.pbtns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pbtn{display:flex;align-items:center;justify-content:center;height:46px;border-radius:11px;border:1px solid var(--line);background:transparent;color:var(--ink);font-family:inherit;font-weight:700;font-size:14.5px;cursor:pointer;-webkit-tap-highlight-color:transparent;padding:0}
.pbtn:disabled{opacity:.5}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);opacity:0;pointer-events:none}
.pbtns button{height:38px;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--mute);font-weight:600;font-size:13px}
.pprev{margin-top:12px}
.pprev img{display:block;width:100%;height:auto;object-fit:contain;border-radius:10px;border:1px solid var(--line);cursor:zoom-in}
.pmeta{display:flex;justify-content:space-between;align-items:center;margin-top:8px;font-size:12.5px;color:var(--mute)}
.pacts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.pa{height:42px;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--ink);font:inherit;font-weight:700;font-size:14px}
.pa.primary{background:var(--accent);border-color:var(--accent);color:var(--bg)}
.pa:disabled{opacity:.4}
.pmeta button{border:1px solid var(--line);background:transparent;border-radius:9px;height:32px;padding:0 12px;font-size:13px}
.viewer{position:fixed;inset:0;z-index:20;background:#000;overflow:auto;-webkit-overflow-scrolling:touch}
.viewer[hidden]{display:none}
.viewer img{display:block;width:100%;max-width:none;height:auto;margin-top:64px}
.viewer.big img{width:260%}
.viewer .z{position:fixed;top:12px;right:64px;height:42px;padding:0 14px;border-radius:21px;border:0;background:rgba(255,255,255,.9);color:#111;font:700 14px inherit}
.viewer .x{position:fixed;top:12px;right:12px;width:42px;height:42px;border-radius:50%;border:0;background:rgba(255,255,255,.9);color:#111;font-size:18px}
.menu-item{width:100%;display:flex;justify-content:space-between;align-items:center;height:48px;padding:0 14px;margin-bottom:14px;border-radius:11px;border:1px solid var(--line);background:var(--bg);font-weight:700;font-size:14.5px}
.tt{position:fixed;inset:0;z-index:30;background:var(--bg);overflow-y:auto}
.tt[hidden]{display:none}
.tt-in{max-width:480px;margin:0 auto;padding:16px 16px 40px;display:flex;flex-direction:column;gap:12px}
.tt-head{display:flex;align-items:center;justify-content:space-between}
.tt-head h2{margin:0;font-size:17px}
.tt-head button{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--card)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.seg[hidden]{display:none}
.seg.c3{grid-template-columns:repeat(3,1fr)}
.seg.c3 button{font-size:13px;padding:0 2px}
.seg button{height:42px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-weight:700;font-size:14px}
.seg button.on{background:var(--accent);border-color:var(--accent);color:#fff}
:root[data-theme="dark"] .seg button.on{color:#0b1b17}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .seg button.on{color:#0b1b17}}
.nextbox{border-radius:12px;padding:12px 14px;background:var(--day-bg);color:var(--day);font-weight:800;font-size:16px;font-variant-numeric:tabular-nums}
.nextbox small{display:block;font-weight:500;font-size:12px;color:var(--mute)}
.ttable{display:grid;grid-template-columns:44px 1fr;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--card)}
.ttable .h{display:flex;align-items:center;justify-content:center;font-weight:800;font-variant-numeric:tabular-nums;border-bottom:1px solid var(--line);background:var(--off-bg);min-height:42px}
.ttable .m{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;padding:6px 12px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums;min-height:42px}
.ttable .h:nth-last-child(2),.ttable .m:last-child{border-bottom:0}
.ttable .cur.h{background:var(--day-bg);color:var(--day)}
.ttable .cur.m{background:var(--day-bg)}
.ttable .m span{font-size:15px;padding:2px 5px;border-radius:6px}
.ttable .m span.nx{background:var(--accent);color:#fff;font-weight:800}
:root[data-theme="dark"] .ttable .m span.nx{color:#0b1b17}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .ttable .m span.nx{color:#0b1b17}}
.ttable sup{font-size:9px;font-weight:700;color:var(--mid);margin-left:1px}
.ttable .nx sup{color:inherit}
.ttable .none{color:var(--mute);font-size:13px}
.tt-note{font-size:12px;color:var(--mute);margin:0}
.chg-date{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;gap:8px;text-align:center}
.chg-date button{height:44px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-size:18px}
.chg-date b{font-size:16px}
#chg .picks button{height:44px;min-width:48px;font-size:15px}
#chg .detail{margin:0}
.memo h2{font-size:14px;margin:0 0 8px;color:var(--mute);font-weight:700}
.memo textarea{width:100%;min-height:72px;resize:vertical;border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--bg);color:var(--ink);font:inherit;line-height:1.5}
.memo textarea:focus-visible{outline:3px solid var(--accent);outline-offset:1px}
.mbtns{display:flex;gap:8px;align-items:center;margin-top:10px}
.mbtns button{height:38px;border-radius:10px;border:0;padding:0 18px;font-weight:700;font-size:14px}
.mbtns .save{background:var(--ink);color:var(--bg)}
.mbtns .del{background:var(--off-bg);color:var(--ink)}
.mbtns span{font-size:12.5px;color:var(--mute)}
.cell{position:relative}
.cell .dot{position:absolute;top:4px;right:5px;width:6px;height:6px;border-radius:50%;background:var(--mid)}
.trains{margin-top:10px}
.trrow{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.trrow .k{width:34px;font-weight:800;font-size:14px}
.trrow .v{flex:1;font-size:14px;font-variant-numeric:tabular-nums}
.trrow button{height:34px;padding:0 14px;border-radius:9px;border:1px solid var(--line);background:var(--card);font-weight:700;font-size:13px}
.ttable .m button.tbtn{font:inherit;font-size:15px;padding:4px 8px;border-radius:7px;border:1px solid var(--line);background:var(--card);font-variant-numeric:tabular-nums;min-height:34px}
.ttable .m button.tbtn.nx{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:800}
:root[data-theme="dark"] .ttable .m button.tbtn.nx{color:#0b1b17}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .ttable .m button.tbtn.nx{color:#0b1b17}}
.pastebox{margin-top:8px;min-height:44px;border:1px dashed var(--line);border-radius:10px;padding:10px;font-size:13px;color:var(--mute);outline:none;-webkit-user-select:text;user-select:text}
.pastebox:empty:before{content:attr(data-ph)}
.pastebox:focus-visible{border-color:var(--accent)}
.sample #pasteBox{display:none}
.scanmsg{font-size:13px;color:var(--mute);margin:10px 0 0}
.scanmsg:empty,#review:empty{display:none}
#review:not(:empty){background:var(--card);border:1px solid var(--line);border-radius:12px;padding:6px 12px 12px;margin-top:10px}
.menu-sec{margin:14px 4px 4px;font-size:12px;font-weight:700;color:var(--mute)}
.annlist{border:1px solid var(--line);border-radius:12px;background:var(--card);overflow:hidden}
.annrow{display:flex;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--line);font-size:15px}
.annrow:last-child{border-bottom:0}
.datanote{display:block;width:100%;text-align:left;margin:-4px 0 12px;padding:10px 14px;border-radius:10px;border:1px solid var(--line);background:var(--card);font:600 13.5px/1.4 inherit;color:var(--ink)}
.datanote.warn{border-color:#d9a400;background:#fff7dc}
.sample #phint{display:none!important}
.rv{display:grid;grid-template-columns:22px 1fr 112px;gap:4px 10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.rv .tag{grid-column:2/-1;font-size:12px;color:var(--mute);margin-top:-2px}
.rv label{font-size:14px;font-weight:600;font-variant-numeric:tabular-nums}
.rv select{height:36px;min-width:0;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit;font-size:16px;padding:0 6px}
.rv input[type=checkbox]{width:18px;height:18px;margin:0;accent-color:var(--accent)}
.scan-actions{display:flex;gap:8px;margin-top:12px}
.scan-actions .btn{flex:1;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-weight:700;font-size:14px}
.scan-actions .btn.primary{background:var(--accent);color:var(--bg);border-color:transparent}
.scan-actions .btn:disabled{opacity:.45}
@media (prefers-reduced-motion:no-preference){.cell{transition:background .15s}}

/* 휴대폰·컴퓨터 어디서나 같은 모양: 폭 390px 이하의 한 칸짜리 화면 */
html{background:var(--bg)}
.phone{position:relative;width:100%;max-width:390px;height:100vh;height:100dvh;margin:0 auto;overflow:hidden;background:var(--bg)}
/* 화면 폭이 390~480px인 휴대폰은 390px 기준 화면을 그대로 확대·축소해서 글자 줄바꿈과 폭을 컴퓨터와 같게 한다 */
:root{--z:1}
@supports (zoom:1){
  .phone{width:390px;max-width:none;zoom:var(--z);height:calc(100vh / var(--z));height:calc(100dvh / var(--z))}
}
body{word-break:keep-all;overflow-wrap:break-word;-webkit-text-size-adjust:100%;text-size-adjust:100%}
.scroll{height:100%;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
.scrim,.drawer,.tt,.viewer{position:absolute}
.viewer .x,.viewer .z{position:absolute}
</style>
</head>
<body>
<div class="phone"><div class="scroll">
<main>
  <div class="top">
    <button id="menuBtn" class="menu-btn" aria-label="메뉴 열기" aria-expanded="false" aria-controls="drawer"><span></span><span></span><span></span></button>
    <h1 class="sr">서건교 근무달력</h1><span id="todayTxt"></span>
  </div>
  <div id="scrim" class="scrim" hidden></div>
  <nav id="drawer" class="drawer" aria-label="메뉴" hidden>
    <div class="drawer-head"><b>목차</b><button id="menuClose" aria-label="메뉴 닫기">✕</button></div>
    <button id="chgOpen" class="menu-item" type="button"><span>근무 변경</span><span aria-hidden="true">›</span></button>
    <button id="annOpen" class="menu-item" type="button"><span>연차 현황</span><span aria-hidden="true">›</span></button>
    <div class="menu-sec">시간표</div>
    <button class="menu-item" type="button" data-st="anrak"><span>동해선 안락역</span><span aria-hidden="true">›</span></button>
    <button class="menu-item" type="button" data-st="bexco"><span>동해선 벡스코역</span><span aria-hidden="true">›</span></button>
    <button class="menu-item" type="button" data-st="sub"><span>지하철 벡스코역 (장산행)</span><span aria-hidden="true">›</span></button>
    <div class="legend" id="legend"></div>
    
  </nav>
  <section class="card today" id="todayCard" aria-live="polite"></section>
  <button type="button" class="datanote" id="dataNote" hidden></button>
  <section class="card photo" hidden style="display:none">
    <h2>근무표로 등록</h2>
    <div class="pbtns">
      <button type="button" class="pbtn primary" id="camBtn">근무표 사진 찍기</button>
      <button type="button" class="pbtn" id="albBtn">앨범에서 선택</button>
      <input class="sr" id="camIn" type="file" accept="image/*" capture="environment" tabindex="-1" aria-hidden="true">
      <input class="sr" id="albIn" type="file" accept="image/*" tabindex="-1" aria-hidden="true">
    </div>
    <div class="pprev" id="pprev" hidden>
      <img id="pimg" alt="저장한 근무표 사진">
      <div class="pmeta"><span id="pwhen"></span></div>
      <div class="pacts"><button id="pDel" type="button" class="pa">사진 삭제</button></div>
    </div>
    <p class="scanmsg" id="scanMsg" role="status" aria-live="polite"></p>
    <div id="review"></div>
    <p class="hint" id="phint" hidden></p>
  </section>
  <section class="card">
    <div class="cal-head">
      <b id="monthTitle"></b>
      <div class="nav">
        <button id="prev" aria-label="이전 달">‹</button>
        <button id="goToday" class="t">오늘</button>
        <button id="next" aria-label="다음 달">›</button>
      </div>
    </div>
    <div class="grid" id="grid"></div>
  </section>
  <section class="card detail" id="detail"></section>
  <section class="card memo" id="memo"></section>
  <div id="chg" class="tt" hidden role="dialog" aria-label="근무 변경">
    <div class="tt-in">
      <div class="tt-head"><h2>근무 변경</h2><button id="chgClose" type="button" aria-label="닫기">✕</button></div>
      <div class="chg-date"><button id="chgPrev" type="button" aria-label="전날">‹</button><b id="chgDay"></b><button id="chgNext" type="button" aria-label="다음날">›</button></div>
      <div class="card detail" id="chgNow"></div>

function info(c){

  if(SPECIAL[c]){const s=SPECIAL[c];return {c,name:s.name,g:s.g,work:!!s.work,time:s.time||null}}
  if(SHIFTS[c]){const t=SHIFTS[c];const h=+t[0].slice(0,2);return {c,name:c+" 근무",g:h<11?"day":(h<18?"mid":"night"),work:true,time:t}}

function renderToday(){
  const i=info(codeOf(todayKey));
  const d=new Date(now.getFullYear(),now.getMonth(),now.getDate());
  $("todayTxt").textContent=`${d.getMonth()+1}월 ${d.getDate()}일 (${DOW[d.getDay()]})`;
  const big=i?`<div class="big">${i.time?tr(i):i.name}</div>`:`<div class="big">등록 없음</div>`;

  // 다음 근무
  let nx=null;
  for(let n=1;n<=40&&!nx;n++){const t=new Date(d);t.setDate(d.getDate()+n);const k=key(t.getFullYear(),t.getMonth(),t.getDate());const j=info(codeOf(k));if(j&&j.work)nx={t,j}}

  const tv=trains[todayKey]||{};
  let body;
  if(tv.go||tv.back){
    // 열차를 골랐을 때: 열차(큰 글씨) → 오늘 근무 / 코드·근무시간 → 다음 근무

  }

  $("todayCard").innerHTML=body;

}
// 등록된 근무표가 끝나가는지 확인해서 새 근무표 등록을 알려 준다
function renderDataNote(){
  let last="",first="";
  for(const k of new Set([...Object.keys(BASE),...Object.keys(edits)])){
    if(!info(codeOf(k)))continue;
    if(!last||k>last)last=k;if(!first||k<first)first=k;
  }
  const n=$("dataNote");
  if(!last){n.hidden=false;n.className="datanote warn";n.textContent="등록된 근무표가 없어요. 아래에서 근무표 사진을 등록해 주세요.";return}
  const L=new Date(+last.slice(0,4),+last.slice(5,7)-1,+last.slice(8,10));
  const T=new Date(now.getFullYear(),now.getMonth(),now.getDate());
  const left=Math.round((L-T)/86400000);
  const md=x=>(+x.slice(5,7))+"/"+(+x.slice(8,10));
  if(left<0){n.hidden=false;n.className="datanote warn";n.textContent=`근무표가 ${md(last)}에 끝났어요. 새 근무표 사진을 등록해 주세요.`}
  else if(left<=3){n.hidden=false;n.className="datanote warn";n.textContent=`근무표가 ${left===0?"오늘":left+"일 뒤"}(${md(last)}) 끝나요. 새 근무표가 나오면 사진으로 등록해 주세요.`}
  else{n.hidden=false;n.className="datanote";n.textContent=`등록된 근무표: ${md(first)} ~ ${md(last)}`}
}

function renderCal(){

    const k=key(y,m,d),c=codeOf(k),i=info(c),dw=(first+d-1)%7;
    h+=`<button class="cell ${i?"has":""} ${k===todayKey?"tod":""} ${k===sel?"sel":""}" data-k="${k}" aria-label="${m+1}월 ${d}일 ${i?c:"근무 없음"}">`+

function renderDetail(){

function renderLegend(){

function loadPhoto(f){
  if(!f)return;
  const rd=new FileReader();
  rd.onload=()=>{
    const im=new Image();
    im.onload=()=>{
      const k=Math.min(1,1600/Math.max(im.width,im.height));
      const c=document.createElement("canvas");c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);
      c.getContext("2d").drawImage(im,0,0,c.width,c.height);
      const t=new Date();
      photo={src:c.toDataURL("image/jpeg",0.8),when:`${t.getMonth()+1}/${t.getDate()} ${pad(t.getHours())}:${pad(t.getMinutes())}`};
      let ok=true;try{localStorage.setItem(PKEY,JSON.stringify(photo))}catch(e){ok=false}
      $("review").replaceChildren();
      renderPhoto();
      if(sampleFn)readSchedule(f);
      else scanSay(ok?"사진을 저장했어요. (내려받은 파일에서는 사진을 읽지 못해요. Claude 링크에서 열어 주세요.)":"사진이 커서 저장은 못 했어요. 이 화면을 닫기 전까지만 볼 수 있어요.");
    };
    im.onerror=()=>scanSay("사진을 열 수 없어요. 다른 사진을 골라 주세요.");
    im.src=rd.result;
  };
  rd.readAsDataURL(f);
}

// 연차 현황표에 이미 들어 있는 날짜인지 (예: "4/19~23", "9/28~29")
function annHas(m,d){
  return ANN.list.some(x=>{const q=x[0].split("~"),a=q[0].split("/").map(Number);let e=a;
    if(q[1])e=q[1].includes("/")?q[1].split("/").map(Number):[a[0],+q[1]];
    const v=m*100+d;return v>=a[0]*100+a[1]&&v<=e[0]*100+e[1]});
}
// 달력에 넣은 휴가(ZZ·H-4·H-2) 중 현황표에 아직 없는 날을 모은다
function annExtra(){
  const out=[];
  for(const k of new Set([...Object.keys(BASE),...Object.keys(edits)])){
    const c=codeOf(k);if(!(c in LV)||k.slice(0,4)!=="2026")continue;
    const [,m,d]=k.split("-").map(Number);if(annHas(m,d))continue;
    out.push({k,m,d,c,v:LV[c]});
  }
  return out.sort((x,y)=>x.k<y.k?-1:1);
}

// 읽은 목록을 (월 기준) 날짜로 바꾼다. 날짜 숫자가 줄어들면 다음 달로 본다.
function scanRows(res){
  let list=res,y=view.y,m=view.m,prev=0;const out=[];
  if(res&&!Array.isArray(res)&&typeof res==="object"){
    list=res.rows;
    const yy=Math.floor(Number(res.year)),mm=Math.floor(Number(res.month));
    if(yy>=2024&&yy<=2035&&mm>=1&&mm<=12){y=yy;m=mm-1}
  }
  if(!Array.isArray(list))return [];
  list.forEach(it=>{
    if(!it)return;
    const d=Math.floor(Number(it.day));let code=String(it.code==null?"":it.code).trim().toUpperCase();
    if(!(d>=1&&d<=31)||!code)return;
    if(d<prev){m++;if(m>11){m=0;y++}}
    prev=d;
    if(d>new Date(y,m+1,0).getDate())return;
    out.push({k:key(y,m,d),y,m,d,code});
  });
  return out;
}
// 사진을 줄여서 보낸다 (너무 크면 읽기가 실패해요)
function shrink(file){
  return new Promise(res=>{
    try{
      const url=URL.createObjectURL(file),img=new Image();
      img.onload=()=>{
        try{
          const M=2800,sc=Math.min(1,M/Math.max(img.naturalWidth,img.naturalHeight));
          const c=document.createElement("canvas");c.width=Math.round(img.naturalWidth*sc);c.height=Math.round(img.naturalHeight*sc);
          c.getContext("2d").drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);
          c.toBlob(bl=>res(bl||file),"image/jpeg",0.9);
        }catch(e){res(file)}
      };
      img.onerror=()=>{URL.revokeObjectURL(url);res(file)};
      img.src=url;
    }catch(e){res(file)}
  });
}
// 읽은 근무를 목록으로 보여 주고, 「달력에 반영」을 누르면 달력에 넣는다
function showReview(rows){
  const box=$("review");box.replaceChildren();
  const items=[];
  rows.forEach((r,i)=>{
    const line=document.createElement("div");line.className="rv";
    const cb=document.createElement("input");cb.type="checkbox";cb.id="rv-cb-"+i;
    const known=ALL_CODES.indexOf(r.code)>-1;cb.checked=known;cb.setAttribute("aria-label",`${r.m+1}월 ${r.d}일 반영`);
    const lb=document.createElement("label");lb.htmlFor=cb.id;
    lb.textContent=`${r.m+1}월 ${r.d}일 (${DOW[new Date(r.y,r.m,r.d).getDay()]})`;
    const sel=document.createElement("select");sel.id="rv-sel-"+i;sel.setAttribute("aria-label",`${r.m+1}월 ${r.d}일 근무코드`);
    const opts=known?ALL_CODES:[r.code].concat(ALL_CODES);
    opts.forEach(c=>{const o=document.createElement("option");o.value=c;o.textContent=(known||c!==r.code)?c:c+" (모름)";sel.appendChild(o)});
    sel.value=r.code;
    const tag=document.createElement("div");tag.className="tag";
    const refresh=()=>{const cur=codeOf(r.k);tag.textContent=cur?(cur===sel.value?"지금과 같아요":"지금 "+cur+" → 바꿔요"):"새로 입력해요"};
    sel.addEventListener("change",refresh);refresh();
    line.append(cb,lb,sel,tag);box.appendChild(line);
    items.push({r,cb,sel});
  });
  const act=document.createElement("div");act.className="scan-actions";
  const ok=document.createElement("button");ok.type="button";ok.className="btn primary";ok.textContent="달력에 반영";
  const no=document.createElement("button");no.type="button";no.className="btn";no.textContent="취소";
  ok.onclick=()=>{
    let n=0;const w0=workCount();
    items.forEach(it=>{
      if(!it.cb.checked)return;const k=it.r.k,c=it.sel.value;
      if(!(k in adds))adds[k]=(k in edits)?edits[k]:null;
      if(BASE[k]===c)delete edits[k];else edits[k]=c;n++;
    });
    save();saveAdds();box.replaceChildren();
    if(n){const f=items.find(it=>it.cb.checked);if(f)view={y:f.r.y,m:f.r.m};renderAll();scanSay(`${n}일 근무를 달력에 반영했어요 (전체 근무 ${w0}일 → ${workCount()}일).`)}
    else scanSay("반영할 날짜가 없어요.");
  };
  no.onclick=()=>{box.replaceChildren();scanSay(IDLE_MSG)};
  act.append(ok,no);box.appendChild(act);
}
function readSchedule(file){
  if(!file||!sampleFn)return;
  $("review").replaceChildren();
  $("camBtn").disabled=true;$("albBtn").disabled=true;
  scanSay("근무표를 읽는 중이에요. 잠시만 기다려 주세요…");
  shrink(file).then(bl=>sampleFn.json(SCHED_PROMPT,{images:[bl],modelTier:"default",cache:false})).then(list=>{
    const rows=scanRows(list);
    if(!rows.length){scanSay("근무표에서 서건교 님 근무를 찾지 못했어요. 사진을 더 선명하게 찍어 다시 시도해 주세요.");return}
    showReview(rows);
    scanSay("읽은 근무예요. 내용을 확인하고 「달력에 반영」을 누르세요.");
  }).catch(e=>{scanSay(scanErr(e))}).then(()=>{$("camBtn").disabled=false;$("albBtn").disabled=false});
}
function initScan(){
  if(!window.claude||typeof window.claude.use!=="function")return;
  window.claude.use("sample").then(sm=>{
    if(!sm)return;
    return Promise.resolve(sm.limits()).then(l=>{
      if(!l||!l.images)return;
      sampleFn=sm;
      const types=l.images.mediaTypes.join(",");
      $("camIn").accept=types;$("albIn").accept=types;
      document.body.classList.add("sample");
      const IDLE="";
      IDLE_MSG=IDLE;scanSay(IDLE);
    });
  }).catch(()=>{});
}
let IDLE_MSG="";
[["camBtn","camIn"],["albBtn","albIn"]].forEach(([b,i])=>{
  const btn=$(b),inp=$(i);
  btn.addEventListener("click",()=>{scanSay("사진 선택창을 열고 있어요…");inp.click()});
  inp.addEventListener("change",()=>{
    const f=inp.files&&inp.files[0];inp.value="";
    if(!f){scanSay(IDLE_MSG);return}
        loadPhoto(f);
  });
  inp.addEventListener("cancel",()=>scanSay(IDLE_MSG));
});
initScan();
renderLegend();renderAll();
</script>
